# Nginx config for musicdev.dancingsalamanders.com
# Installed to /etc/nginx/sites-available/musicdev.dancingsalamanders.com
# by the deploy-dev workflow on first run; Certbot then adds the HTTPS server
# block and turns the HTTP block into a redirect automatically.

server {
    listen 80;
    server_name musicdev.dancingsalamanders.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

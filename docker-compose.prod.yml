# Production Docker Compose
# Run with: sudo docker compose -f docker-compose.prod.yml up --build -d
# Bound to 127.0.0.1 only — the host's system nginx (with certbot certs)
# terminates TLS and proxies music.dancingsalamanders.com to this port.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # 3006 = prod, override with WEB_PORT for other environments (e.g. dev uses 3009)
      - "127.0.0.1:${WEB_PORT:-3006}:80"
